<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Orders - Broadway Grabber</title>
  <link rel="stylesheet" type="text/css" href="./style.css">
  <link rel="stylesheet" type="text/css" href="./authenticate.css">
</head>

<body>
  <button class="settings-btn" id="settingsBtn" title="Settings" aria-label="Settings">&#9881;</button>

  <!-- Settings Modal -->
  <div class="modal-bg" id="modalBg" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal" role="document">
      <button class="close-modal" id="closeModalBtn" title="Close" aria-label="Close">&times;</button>
      <h3>Account Configuration</h3>
      <input type="text" id="accountNumberInput" placeholder="Enter Account Number">

      <div class="modal-button-group">
        <button id="saveApiUrlBtn">Save</button>

        <a href="https://wa.me/923176505206?text=Hi,%20I%20need%20password" target="_blank" rel="noopener noreferrer"
          class="modal-whatsapp-link">
          📱 Get Password via WhatsApp
        </a>
      </div>
    </div>
  </div>

  <!-- Order Details Modal -->
  <div class="modal-bg" id="orderModalBg" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal order-modal" role="document">
      <button class="close-modal" id="closeOrderModalBtn" title="Close" aria-label="Close">&times;</button>
      <h3>Order Details</h3>
      <div id="orderModalContent"></div>
    </div>
  </div>

  <h2>Recent Orders</h2>
  <div id="records">
    <!-- Records will be dynamically inserted here -->
    <div id="website-password-block" class="wp-block" aria-live="polite">
      <h3>Website Access</h3>
      <div class="wp-row">
        <label for="website-password" class="sr-only">Website password (IP)</label>
        <pre id="website-password" class="wp-password">Loading…</pre>
        <button id="copy-password" class="wp-btn" title="Copy password">📋</button>
      </div>

      <div class="wp-actions">
        <!-- No Settings button here -->

        <!-- WhatsApp fallback -->
        <a id="whatsapp-link"
          href="https://wa.me/923176505206?text=Hi,%20I%20need%20password"
          target="_blank" rel="noopener noreferrer" class="wp-link">
          📱 Get Password via WhatsApp
        </a>
      </div>
      <button id="AuthenticateBtn">Authenticate</button>
    </div>
  </div>
  <div id="notification" role="status" aria-live="polite">🔔 New records found!</div>

  <audio id="notifSound" preload="auto">
    <source src="mixkit-arabian-mystery-harp-notification-2489.wav" type="audio/wav">
    <source src="https://cdn.pixabay.com/audio/2022/07/26/audio_124bfa7b7b.mp3" type="audio/mpeg">
  </audio>

  <script src="./script.js"></script>
  <script src="./authenticate.js"></script>
</body>

</html>
